<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Подборка: проверка копирования</title><style>body{font:16px/1.5 system-ui;margin:20px}button,input{min-height:44px;max-width:100%}[hidden]{display:none!important}.pass{color:green}.fail{color:#a00}</style><h1>Копирование подборки</h1><button id="run">Проверить</button><p id="result" role="status">Готово</p><ol id="results"></ol><div id="fixture"></div><script type="module">
import {mountExploration} from '../../trifoti/warm/exploration-panel.js';
const host=document.querySelector('#fixture'),results=document.querySelector('#results');
const tick=()=>new Promise(r=>setTimeout(r,0));
function setup(clipboard){host.replaceChildren();mountExploration({host,document,location:{hash:'#explore/mascot,pink',search:'',pathname:'index.html'},history:{replaceState(){},pushState(){}},onOpen(){},clipboard});return {share:[...host.querySelectorAll('button')].find(x=>x.textContent==='Скопировать подборку'),other:[...host.querySelectorAll('button')].find(x=>x.textContent==='Сбросить выбор'),field:host.querySelector('.case-share-fallback input')}}
async function test(name,fn){const li=document.createElement('li');try{await fn();li.textContent='PASS: '+name;li.className='pass'}catch(e){li.textContent='FAIL: '+name+' · '+e.message;li.className='fail'}results.append(li)}
function assert(x,m){if(!x)throw Error(m)}
document.querySelector('#run').onclick=async()=>{results.replaceChildren();await test('Поздний отказ сохраняет новый фокус',async()=>{let reject;const f=setup({writeText:()=>new Promise((_,r)=>reject=r)});f.share.focus();f.share.click();f.other.focus();reject(Error('Controlled denial'));await tick();assert(document.activeElement===f.other,'Фокус перехвачен');assert(!f.field.parentElement.hidden,'Нет ручного копирования')});await test('Отказ на текущей кнопке выделяет ссылку',async()=>{const f=setup({writeText:async()=>{throw Error('Controlled denial')}});f.share.focus();f.share.click();await tick();assert(document.activeElement===f.field,'Нет фокуса');assert(f.field.selectionStart===0&&f.field.selectionEnd===f.field.value.length,'Нет выделения')});document.querySelector('#result').textContent=results.querySelector('.fail')?'Есть ошибки':'PASS: 2 проверки';};
</script></html>
